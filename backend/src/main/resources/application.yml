spring:
  application:
    name: beej-ecommerce

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/beej_ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  security:
    jwt:
      secret: beejSuperSecureJwtSecretKeyForAuthenticationAndAuthorizationSystem2026ProjectSecurityKeyVeryLong
      expiration: 86400000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:anikesh56433@gmail.com}
    password: ${EMAIL_PASSWORD:opbt rnym psvj wzzc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.beej: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

file:
  upload-dir: ./uploads

cors:
  allowed-origins: http://localhost:4200,http://localhost:3000

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO

